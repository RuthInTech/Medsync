services:
  - type: web
    name: siyaphila-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free          # upgrade to starter for persistent disk support
    healthCheckPath: /health

    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard — paste Supabase connection string
      - key: PORT
        value: 10000
